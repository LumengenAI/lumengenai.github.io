<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8faf9">
    {% seo %}
    {% feed_meta %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">跳转到正文</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Henry Xing，返回首页">Henry Xing<span class="brand-mark">.</span></a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/topics/' | relative_url }}" {% if page.section == 'topics' or page.layout == 'topic' %}aria-current="page"{% endif %}>专题</a>
          <a href="{{ '/notes/' | relative_url }}" {% if page.section == 'notes' or page.layout == 'post' %}aria-current="page"{% endif %}>笔记</a>
          <a href="{{ '/courses/' | relative_url }}" {% if page.section == 'courses' or page.layout == 'course' %}aria-current="page"{% endif %}>课程</a>
          <a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>关于</a>
        </nav>
      </div>
    </header>
    <main id="main" class="shell main-content">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>© {{ 'now' | date: '%Y' }} Henry Xing</span>
        <div class="footer-links">
          <a href="https://github.com/LumengenAI" rel="me">GitHub ↗</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </div>
      </div>
    </footer>
  </body>
</html>
